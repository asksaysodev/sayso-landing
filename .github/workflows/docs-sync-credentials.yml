name: Docs Sync credential preflight
on:
  workflow_dispatch:
    inputs:
      product_and_vercel:
        description: Check the GitHub App installation and Vercel production reads
        type: boolean
        default: false
  push:
    branches: [feat/help-center-docs-sync]
    paths:
      - '.github/workflows/docs-sync-credentials.yml'
      - 'scripts/docs-sync/preflight.mjs'
      - 'scripts/docs-sync/github-app.mjs'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Dash identity without sending a message
        env:
          DASH_SLACK_BOT_TOKEN: ${{ secrets.DASH_SLACK_BOT_TOKEN }}
          DASH_SLACK_CHANNEL_ID: ${{ vars.DASH_SLACK_CHANNEL_ID || secrets.DASH_SLACK_CHANNEL_ID }}
        run: node scripts/docs-sync/notify.mjs auth-test
      - name: Verify Anthropic account access without sending documents
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.ANTHROPIC_API_KEY;
          if(!key)throw Error('Organization secret unavailable');
          const response=await fetch('https://api.anthropic.com/v1/models?limit=1',{headers:{'x-api-key':key,'anthropic-version':'2023-06-01'}});
          if(!response.ok)throw Error('Anthropic preflight HTTP '+response.status);
          console.log('Anthropic credential accepted');
          NODE
  product-and-vercel:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.product_and_vercel &&
      (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/feat/help-center-docs-sync')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/help-center-docs-sync' &&
      vars.DOCS_SYNC_APP_ID != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: reader
        env:
          DOCS_SYNC_APP_ID: ${{ vars.DOCS_SYNC_APP_ID }}
          DOCS_SYNC_APP_PRIVATE_KEY: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
        run: node scripts/docs-sync/github-app.mjs
      - name: Verify repository scope and production reads
        env:
          DOCS_SYNC_READ_TOKEN: ${{ steps.reader.outputs.token }}
          DOCS_SYNC_VERCEL_TOKEN: ${{ secrets.DOCS_SYNC_VERCEL_TOKEN }}
        run: node scripts/docs-sync/preflight.mjs
