name: Docs Sync offline editorial replay
on:
  workflow_dispatch:
  push:
    branches: [feat/help-center-docs-sync]
    paths:
      - '.github/workflows/docs-sync-private-review.yml'
      - 'scripts/docs-sync/private-*.mjs'
permissions:
  contents: read
jobs:
  replay:
    if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/feat/help-center-docs-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install verified public inference runtime and weights
        run: |
          set -euo pipefail
          working="$RUNNER_TEMP/docs-sync-offline"
          mkdir -p -m 700 "$working/bin"
          curl --fail --silent --show-error --location --retry 2 --max-time 240 -o "$working/runtime.tgz" https://github.com/ggml-org/llama.cpp/releases/download/b12110/llama-b12110-bin-ubuntu-x64.tar.gz
          echo "368227edcc229be5f9bed16a2223d79b5e41d0ac2e19bcf5825e82291c060e55  $working/runtime.tgz" | sha256sum -c -
          tar -xzf "$working/runtime.tgz" -C "$working/bin"
          curl --fail --silent --show-error --location --retry 2 --max-time 400 -o "$working/model.gguf" https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf
          echo "7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5  $working/model.gguf" | sha256sum -c -
      - name: Mint the product reader
        id: reader
        env:
          DOCS_SYNC_APP_ID: ${{ vars.DOCS_SYNC_APP_ID }}
          DOCS_SYNC_APP_PRIVATE_KEY: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
        run: node scripts/docs-sync/github-app.mjs
      - name: Collect historical comparisons inside the runner
        env:
          DOCS_SYNC_READ_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          node scripts/docs-sync/inventory.mjs
          node scripts/docs-sync/private-replay-input.mjs
      - name: Review without external network access or credentials
        shell: bash
        run: |
          set -euo pipefail
          working="$RUNNER_TEMP/docs-sync-offline"
          executable="$(find "$working/bin" -name llama-server -type f -print -quit)"
          test -n "$executable"
          sudo unshare --net -- /bin/bash -euc '
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH=/usr/bin:/bin HOME="$2" /bin/bash -euc "
              umask 077
              export LD_LIBRARY_PATH=\"\$(dirname \"\$1\")\"
              \"\$1\" --model \"\$2/model.gguf\" --offline --host 127.0.0.1 --port 38491 --ctx-size 16384 --parallel 1 --threads 4 --reasoning off --no-webui >\"\$2/reviewer.log\" 2>&1 &
              trap \"kill \$!\" EXIT
              GITHUB_STEP_SUMMARY=\"\$4\" \"\$3\" scripts/docs-sync/private-review.mjs
            " _ "$3" "$2" "$4" "$5"
          ' _ "$USER" "$working" "$executable" "$(command -v node)" "$GITHUB_STEP_SUMMARY"
