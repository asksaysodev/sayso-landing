name: Docs Sync discovery (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-sync-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Inventory Help Center
        run: node scripts/docs-sync/inventory.mjs
      - name: Mint read-only product token
        id: app
        env:
          DOCS_SYNC_APP_ID: ${{ vars.DOCS_SYNC_APP_ID }}
          DOCS_SYNC_APP_PRIVATE_KEY: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
        run: node scripts/docs-sync/github-app.mjs
      - name: Discover production releases
        env:
          DOCS_SYNC_READ_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/docs-sync/discover.mjs
      - name: Save discovery report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-sync-discovery
          path: .docs-sync/releases.json
          if-no-files-found: ignore
          retention-days: 7
